<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="mintBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34DEC4"/>
      <stop offset="100%" stop-color="#22C8AE"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0E5E52" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Mint base container -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#mintBg)"/>

  <!-- Crisp White Floating Camera Window -->
  <rect x="136" y="116" width="240" height="280" rx="64" fill="#FFFFFF" filter="url(#softShadow)"/>

  <!-- Camera Lens -->
  <circle cx="256" cy="246" r="66" fill="#111B19"/>
  <circle cx="256" cy="246" r="42" fill="none" stroke="#2AD6BB" stroke-width="6"/>
  <circle cx="256" cy="246" r="20" fill="#FFFFFF"/>
  <circle cx="244" cy="234" r="6" fill="#2AD6BB"/>

  <!-- Indicator dot -->
  <circle cx="334" cy="164" r="8" fill="#2AD6BB"/>
</svg>
