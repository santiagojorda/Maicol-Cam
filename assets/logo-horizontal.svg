<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="mintGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#46EACF"/>
      <stop offset="100%" stop-color="#2AD6BB"/>
    </linearGradient>
    <filter id="shadowH" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="240" rx="32" fill="#0E1614"/>

  <!-- Icon (left) -->
  <g transform="translate(60, 35)">
    <!-- Floating window -->
    <rect x="0" y="0" width="130" height="170" rx="38" fill="#182522" stroke="url(#mintGradH)" stroke-width="6" filter="url(#shadowH)"/>
    <!-- Camera lens -->
    <circle cx="65" cy="80" r="38" fill="#0C1412" stroke="#2AD6BB" stroke-width="4.5"/>
    <circle cx="65" cy="80" r="23" fill="#14221F" stroke="#46EACF" stroke-width="2"/>
    <circle cx="65" cy="80" r="12" fill="#2AD6BB"/>
    <circle cx="70" cy="75" r="3.5" fill="#FFFFFF"/>
    <!-- Dot -->
    <circle cx="104" cy="26" r="4.5" fill="#46EACF"/>
  </g>

  <!-- Brand Typography (right) -->
  <g transform="translate(235, 125)">
    <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Maicol <tspan fill="url(#mintGradH)">Cam</tspan></text>
    <text y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#8AA8A1" letter-spacing="3">MINIMALIST FLOATING WEBCAM</text>
  </g>
</svg>
