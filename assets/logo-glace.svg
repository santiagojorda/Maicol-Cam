<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="mintBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34DEC4"/>
      <stop offset="100%" stop-color="#22C8AE"/>
    </linearGradient>

    <!-- Frosted Glass Gradient -->
    <linearGradient id="frostedGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Glass Border Gradient -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Soft diffuse shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0E5E52" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Mint base background -->
  <rect width="512" height="512" rx="128" fill="url(#mintBg)"/>

  <!-- Frosted Glass Floating Window (Glace) -->
  <rect x="136" y="116" width="240" height="280" rx="72" fill="url(#frostedGlass)" stroke="url(#glassBorder)" stroke-width="4.5" filter="url(#softShadow)"/>

  <!-- Minimal Camera Lens -->
  <!-- Outer frosted disc -->
  <circle cx="256" cy="256" r="54" fill="#FFFFFF" fill-opacity="0.45" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="3"/>
  <!-- Pure Mint Lens Pupil -->
  <circle cx="256" cy="256" r="24" fill="#2AD6BB"/>
  <!-- Subtle glass glare -->
  <circle cx="266" cy="246" r="6" fill="#FFFFFF" fill-opacity="0.95"/>

  <!-- Tiny status dot -->
  <circle cx="336" cy="156" r="6" fill="#FFFFFF" fill-opacity="0.85"/>
</svg>
