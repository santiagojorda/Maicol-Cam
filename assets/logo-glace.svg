<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="mintBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34DEC4"/>
      <stop offset="100%" stop-color="#22C8AE"/>
    </linearGradient>

    <!-- Frosted Glass Gradient -->
    <linearGradient id="frostedGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.84"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.42"/>
    </linearGradient>

    <!-- Glass Border Gradient -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Soft diffuse shadow -->
    <filter id="softShadow" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#0E5E52" flood-opacity="0.24"/>
    </filter>
  </defs>

  <!-- Mint base background -->
  <rect width="512" height="512" rx="112" fill="url(#mintBg)"/>

  <!-- Vertical Frosted Glass Floating Window (Narrower vertical portrait) -->
  <rect x="116" y="44" width="280" height="424" rx="76" fill="url(#frostedGlass)" stroke="url(#glassBorder)" stroke-width="5.5" filter="url(#softShadow)"/>

  <!-- Minimal Camera Lens -->
  <circle cx="256" cy="246" r="82" fill="#FFFFFF" fill-opacity="0.45" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="4"/>
  <circle cx="256" cy="246" r="38" fill="#2AD6BB"/>
  <circle cx="269" cy="233" r="8.5" fill="#FFFFFF" fill-opacity="0.95"/>

  <!-- Status indicator dot -->
  <circle cx="358" cy="82" r="7.5" fill="#FFFFFF" fill-opacity="0.85"/>
</svg>
