<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="mintBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34DEC4"/>
      <stop offset="100%" stop-color="#22C8AE"/>
    </linearGradient>

    <!-- Frosted Glass Gradient -->
    <linearGradient id="frostedGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.42"/>
    </linearGradient>

    <!-- Glass Border Gradient -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Soft diffuse shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0E5E52" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Mint base background -->
  <rect width="512" height="512" rx="100" fill="url(#mintBg)"/>

  <!-- Frosted Glass Floating Window (Much larger, minimal margin) -->
  <rect x="52" y="44" width="408" height="424" rx="92" fill="url(#frostedGlass)" stroke="url(#glassBorder)" stroke-width="6" filter="url(#softShadow)"/>

  <!-- Minimal Camera Lens (Proportionally larger) -->
  <circle cx="256" cy="256" r="98" fill="#FFFFFF" fill-opacity="0.45" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="4.5"/>
  <circle cx="256" cy="256" r="46" fill="#2AD6BB"/>
  <circle cx="272" cy="240" r="10" fill="#FFFFFF" fill-opacity="0.95"/>

  <!-- Status indicator dot -->
  <circle cx="412" cy="94" r="9" fill="#FFFFFF" fill-opacity="0.85"/>
</svg>
