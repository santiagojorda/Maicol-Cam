<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E1C"/>
      <stop offset="100%" stop-color="#0A100F"/>
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#46EACF"/>
      <stop offset="100%" stop-color="#2AD6BB"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base container -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="#2AD6BB" stroke-width="2" stroke-opacity="0.2"/>

  <!-- Floating Window outline -->
  <rect x="132" y="116" width="248" height="280" rx="64" fill="#182522" stroke="url(#mintGrad)" stroke-width="10" filter="url(#glow)"/>

  <!-- Camera Lens outer ring -->
  <circle cx="256" cy="246" r="68" fill="#0C1412" stroke="#2AD6BB" stroke-width="7"/>
  <circle cx="256" cy="246" r="42" fill="#14221F" stroke="#46EACF" stroke-width="3" stroke-opacity="0.6"/>
  <circle cx="256" cy="246" r="22" fill="#2AD6BB"/>
  <circle cx="266" cy="236" r="6" fill="#FFFFFF"/>

  <!-- Indicator recording / power dot -->
  <circle cx="334" cy="164" r="8" fill="#46EACF"/>
</svg>
