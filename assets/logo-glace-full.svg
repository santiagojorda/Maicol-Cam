<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Frosted Glass Gradient -->
    <linearGradient id="frostedGlassFull" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E8FAF6" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Glass Border Gradient -->
    <linearGradient id="glassBorderFull" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#2AD6BB" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Background Mint Tint -->
    <linearGradient id="mintBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34DEC4"/>
      <stop offset="100%" stop-color="#20C6AE"/>
    </linearGradient>

    <filter id="softShadowFull" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0E5E52" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Mint base background -->
  <rect width="512" height="512" rx="112" fill="url(#mintBase)"/>

  <!-- Frosted Glass Card filling almost entire canvas -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#frostedGlassFull)" stroke="url(#glassBorderFull)" stroke-width="7" filter="url(#softShadowFull)"/>

  <!-- Camera Lens - Large & Prominent -->
  <circle cx="256" cy="256" r="128" fill="#FFFFFF" fill-opacity="0.5" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="5"/>
  <circle cx="256" cy="256" r="62" fill="#2AD6BB"/>
  <circle cx="278" cy="234" r="14" fill="#FFFFFF" fill-opacity="0.95"/>

  <!-- Status indicator dot -->
  <circle cx="430" cy="82" r="11" fill="#2AD6BB" fill-opacity="0.85"/>
</svg>
